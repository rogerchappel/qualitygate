name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<package.version> tag to recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Publish package and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          expected_tag="v${version}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use strict v<major>.<minor>.<patch> syntax: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$tagged_commit" = "$(git rev-parse HEAD)" || {
            echo "Tag $RELEASE_TAG does not resolve to the checked-out commit" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG does not resolve to the triggering commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          filename="$(npm pack --json | node --input-type=module -e "let data=''; for await (const chunk of process.stdin) data += chunk; process.stdout.write(JSON.parse(data)[0].filename)")"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Check npm publication state
        id: npm
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@rogerchappel/qualitygate@${{ steps.version.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm; skipping publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.npm.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Verify published version
        run: test "$(npm view "@rogerchappel/qualitygate@${{ steps.version.outputs.version }}" version)" = "${{ steps.version.outputs.version }}"

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists; verifying its tag."
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
